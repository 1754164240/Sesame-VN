name: 📦Auto Build for N
run-name: 📦 ${{ github.actor }} @ Github Action

on:
  push:
    branches: [ "codex/dev" ]
  pull_request:
    branches: [ "codex/dev" ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⏰ Set Timezone to Asia/Shanghai
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: 👨🏻‍💻 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: ☕ Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle
      - name: 🤝 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: ☎️ Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔥 Build with Gradle
        run: ./gradlew assembleRelease -Pversion=${{ github.ref_name }}

      - name: 📊 Locate APKs and Set Outputs
        id: locate_apks
        run: |
          release_dir="app/build/outputs/apk/release"
          arm64_apk=$(find "$release_dir" -name "*-arm64-v8a-*.apk" | head -n 1)
          armv7_apk=$(find "$release_dir" -name "*-armeabi-v7a-*.apk" | head -n 1)
          x86_apk=$(find "$release_dir" -name "*-x86-*.apk" | head -n 1)
          x86_64_apk=$(find "$release_dir" -name "*-x86_64-*.apk" | head -n 1)
          universal_apk=$(find "$release_dir" -name "*-universal-*.apk" | head -n 1)
          echo "arm64_apk=$arm64_apk" >> $GITHUB_OUTPUT
          echo "armv7_apk=$armv7_apk" >> $GITHUB_OUTPUT
          echo "x86_apk=$x86_apk" >> $GITHUB_OUTPUT
          echo "x86_64_apk=$x86_64_apk" >> $GITHUB_OUTPUT
          echo "universal_apk=$universal_apk" >> $GITHUB_OUTPUT

      - name: ⏳ Copy APKs to staging for signing
        run: |
          mkdir -p app/build/outputs/apk/all
          cp "${{ steps.locate_apks.outputs.arm64_apk }}" app/build/outputs/apk/all/
          cp "${{ steps.locate_apks.outputs.armv7_apk }}" app/build/outputs/apk/all/
          cp "${{ steps.locate_apks.outputs.x86_apk }}" app/build/outputs/apk/all/
          cp "${{ steps.locate_apks.outputs.x86_64_apk }}" app/build/outputs/apk/all/
          cp "${{ steps.locate_apks.outputs.universal_apk }}" app/build/outputs/apk/all/

      - name: 🔐 Sign APKs
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/all
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: 📦 Extract Signed APK Paths
        id: extract_apks
        run: |
          IFS=':' read -r -a files <<< "${{ steps.sign_apks.outputs.signedFiles }}"
          for file in "${files[@]}"; do
            if [[ "$file" == *arm64-v8a* ]]; then
              echo "signed_arm64=$file" >> $GITHUB_OUTPUT
            elif [[ "$file" == *armeabi-v7a* ]]; then
              echo "signed_armv7=$file" >> $GITHUB_OUTPUT
            elif [[ "$file" == *x86_64* ]]; then
              echo "signed_x86_64=$file" >> $GITHUB_OUTPUT
            elif [[ "$file" == *x86* ]]; then
              echo "signed_x86=$file" >> $GITHUB_OUTPUT
            elif [[ "$file" == *universal* ]]; then
              echo "signed_universal=$file" >> $GITHUB_OUTPUT
            fi
          done

      - name: 🚀 Upload APK - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: ${{ steps.extract_apks.outputs.signed_arm64 }}

      - name: 🚀 Upload APK - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a
          path: ${{ steps.extract_apks.outputs.signed_armv7 }}

      - name: 🚀 Upload APK - x86
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86
          path: ${{ steps.extract_apks.outputs.signed_x86 }}

      - name: 🚀 Upload APK - x86_64
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: ${{ steps.extract_apks.outputs.signed_x86_64 }}

      - name: 🚀 Upload APK - universal
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: ${{ steps.extract_apks.outputs.signed_universal }}

      - name: 🛠️ Extract file names and version
        id: extract_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          arm64_file=$(basename "${{ steps.extract_apks.outputs.signed_arm64 }}")
          armv7_file=$(basename "${{ steps.extract_apks.outputs.signed_armv7 }}")
          x86_file=$(basename "${{ steps.extract_apks.outputs.signed_x86 }}")
          x86_64_file=$(basename "${{ steps.extract_apks.outputs.signed_x86_64 }}")
          universal_file=$(basename "${{ steps.extract_apks.outputs.signed_universal }}")
          release_date=$(date +%F)
          commit_sha=$(git rev-parse HEAD)
          if [[ "$EVENT_NAME" == "release" ]]; then
            # 正式发布沿用事件标签，不能再按分支名写回旧版本。
            version="$RELEASE_TAG"
            release_name="${RELEASE_NAME:-$version}"
          else
            # 每次运行及重跑使用独立标签，保留历史版本及其附件。
            branch="${GITHUB_REF_NAME//\//-}"
            version="auto-${branch}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${commit_sha:0:7}"
            release_name="${release_date} · ${version}"
          fi
          artifact_version="${version//\//-}"
          echo "arm64_file=$arm64_file" >> $GITHUB_OUTPUT
          echo "armv7_file=$armv7_file" >> $GITHUB_OUTPUT
          echo "x86_file=$x86_file" >> $GITHUB_OUTPUT
          echo "x86_64_file=$x86_64_file" >> $GITHUB_OUTPUT
          echo "universal_file=$universal_file" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "artifact_version=$artifact_version" >> $GITHUB_OUTPUT
          echo "release_date=$release_date" >> $GITHUB_OUTPUT
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT

      - name: 🎨 Generate APKS Checksum
        run: |
          sha256sum ${{ steps.extract_apks.outputs.signed_arm64 }} > CHECKSUMS-Sesame-arm64-v8a-${{ steps.extract_info.outputs.artifact_version }}.apk.sha256
          sha256sum ${{ steps.extract_apks.outputs.signed_armv7 }} > CHECKSUMS-Sesame-armeabi-v7a-${{ steps.extract_info.outputs.artifact_version }}.apk.sha256
          sha256sum ${{ steps.extract_apks.outputs.signed_x86 }} > CHECKSUMS-Sesame-x86-${{ steps.extract_info.outputs.artifact_version }}.apk.sha256
          sha256sum ${{ steps.extract_apks.outputs.signed_x86_64 }} > CHECKSUMS-Sesame-x86_64-${{ steps.extract_info.outputs.artifact_version }}.apk.sha256
          sha256sum ${{ steps.extract_apks.outputs.signed_universal }} > CHECKSUMS-Sesame-universal-${{ steps.extract_info.outputs.artifact_version }}.apk.sha256

      - name: 📝 Generate Dynamic Message
        id: commit_info
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 初始化一个临时文件名
          MESSAGE_FILE=$(mktemp)

          if [[ "${{ github.event_name }}" == "push" && -n '${{ toJSON(github.event.commits) }}' && '${{ toJSON(github.event.commits) }}' != 'null' && '${{ toJSON(github.event.commits) }}' != '[]' ]]; then
            echo "Source: Push Event"
            # 【修复】使用正确的 jq 语法截取 commit ID 前7个字符
            echo '${{ toJSON(github.event.commits) }}' | jq -r '.[] | "• \(.message | split("\n")[0]) (<a href=\"\(.url)\">\(.id[0:7])</a>)"' > "$MESSAGE_FILE"

          elif [[ "${{ github.event_name }}" == "pull_request" && -n '${{ toJSON(github.event.pull_request) }}' && '${{ toJSON(github.event.pull_request) }}' != 'null' ]]; then
            echo "Source: Pull Request Event"
            PR_URL="${{ github.event.pull_request.html_url }}"
            API_URL="${{ github.event.pull_request.commits_url }}"

            # 写入 PR 标题
            echo -e "<b>PR:</b> <a href=\"$PR_URL\">$PR_TITLE</a>\n\n<b>Commits:</b>" > "$MESSAGE_FILE"

            COMMITS_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                                -H "Accept: application/vnd.github.v3+json" \
                                "$API_URL")

            # 【修复】使用正确的 jq 语法截取 commit SHA 前7个字符
            echo "$COMMITS_JSON" | jq -r 'if type == "array" then .[] | "• \(.commit.message | split("\n")[0]) (<a href=\"\(.html_url)\">\(.sha[0:7])</a>)" else "" end' >> "$MESSAGE_FILE"

          else
            echo "Source: Manual or unknown"
            echo "手动触发构建" > "$MESSAGE_FILE"
          fi

          # 使用 GitHub Actions 官方推荐的多行输出语法
          {
            echo "message_string<<EOF"
            cat "$MESSAGE_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # 清理临时文件
          rm "$MESSAGE_FILE"

      - name: 🚀 Publish Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.extract_info.outputs.release_name }}
          files: |
            ${{ steps.extract_apks.outputs.signed_arm64 }}
          tag_name: ${{ steps.extract_info.outputs.version }}
          target_commitish: ${{ steps.extract_info.outputs.commit_sha }}
          overwrite_files: false
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          body: |
            ${{ github.event.release.body }}

            📦 构建版本：`${{ steps.extract_info.outputs.version }}`
            源码提交：[`${{ steps.extract_info.outputs.commit_sha }}`](https://github.com/${{ github.repository }}/commit/${{ steps.extract_info.outputs.commit_sha }})
            
            > ## 下载说明
            <b>- arm64-v8a:</b> 适用于64位ARM设备 (主流新手机)
            >
